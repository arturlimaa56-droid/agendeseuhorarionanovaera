<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Nova Era Barbearia</title><style id="app-style">
:root{--bg:#0b0b0c;--card:#151517;--line:#2a2a2d;--gold:#c9a24a;--gold2:#e6c778;--txt:#f2ede2;--mut:#9a9588;--blue:#2f6df0;--red:#d62839;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--txt);font-family:Georgia,"Times New Roman",serif;line-height:1.5}
.pole{height:6px;background:repeating-linear-gradient(135deg,var(--red) 0 12px,#fff 12px 24px,var(--blue) 24px 36px,#fff 36px 48px)}
header{text-align:center;padding:28px 16px 18px;border-bottom:1px solid var(--line);background:radial-gradient(ellipse at top,#241d0c,transparent 70%)}
h1{margin:0;font-size:2.2rem;letter-spacing:.28em;font-weight:400;color:var(--gold2);text-transform:uppercase}
h1 span{display:block;font-size:.8rem;letter-spacing:.5em;color:var(--mut);margin-top:4px}
.rule{width:80px;height:2px;margin:12px auto 0;background:linear-gradient(90deg,var(--red),var(--gold),var(--blue))}
main{max-width:640px;margin:0 auto;padding:20px 16px 60px}
section{background:rgba(21,21,23,.9);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
h2{margin:0 0 12px;font-size:.95rem;font-weight:400;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
h2 b{display:inline-block;width:22px;height:22px;line-height:22px;text-align:center;border-radius:50%;background:var(--gold);color:#000;font-size:.8rem;margin-right:8px;letter-spacing:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.two{grid-template-columns:1fr 1fr}
button,input{font:inherit}
.opt{background:#0f0f10;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:10px 8px;cursor:pointer;text-align:center;transition:.15s}
.opt:hover{border-color:var(--gold)}
.opt.on{background:var(--gold);color:#000;border-color:var(--gold2);font-weight:bold}
.opt:disabled{opacity:.3;text-decoration:line-through;cursor:not-allowed}
.opt small{display:block;color:inherit;opacity:.7;font-size:.75rem}
.barber{padding:16px 8px;border-top:3px solid var(--blue)}
.barber+.barber{border-top-color:var(--red)}
.barber .av{width:46px;height:46px;border-radius:50%;margin:0 auto 6px;background:#000;border:2px solid var(--gold);color:var(--gold2);display:flex;align-items:center;justify-content:center;font-size:1.3rem}
label{display:block;font-size:.8rem;letter-spacing:.1em;color:var(--mut);margin:10px 0 4px;text-transform:uppercase}
input{width:100%;background:#0f0f10;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:11px;font-size:1rem}
input:focus{outline:none;border-color:var(--gold)}
.go{width:100%;margin-top:14px;padding:14px;border:0;border-radius:8px;background:linear-gradient(180deg,var(--gold2),var(--gold));color:#000;font-weight:bold;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;font-size:1rem}
.go:disabled{opacity:.4;cursor:not-allowed}
.ghost{background:none;border:1px solid var(--line);color:var(--mut);border-radius:20px;padding:6px 14px;cursor:pointer;font-size:.8rem}
.ghost:hover{color:var(--gold);border-color:var(--gold)}
.msg{padding:12px;border-radius:8px;margin-top:12px;font-size:.9rem}
.err{background:#2a0e12;border:1px solid var(--red);color:#ffb3ba}
.ok{background:#0e1a2e;border:1px solid var(--blue);color:#bcd3ff}
.note{color:var(--mut);font-size:.78rem;margin-top:10px}
.hide{display:none!important}
.done{text-align:center}
.done .big{font-size:2.4rem;color:var(--gold2)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;border-top:1px solid var(--line);padding:10px 0;font-size:.9rem}
.row:first-child{border-top:0}
.row .t{color:var(--gold2);min-width:48px}
.row .c{flex:1}
.row .c small{display:block;color:var(--mut)}
.x{background:none;border:1px solid var(--red);color:#ff8a95;border-radius:6px;padding:4px 10px;cursor:pointer}
.tag{font-size:.7rem;border-radius:10px;padding:1px 8px;margin-left:6px;color:#fff}
.t1{background:var(--blue)}.t2{background:var(--red)}
.top{display:flex;justify-content:flex-end;margin-bottom:10px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px;margin-top:8px}
.gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;border:1px solid var(--line);display:block}
.lnk{display:inline-block;margin:8px 8px 0 0;padding:5px 12px;border:1px solid var(--gold);border-radius:20px;color:var(--gold2);text-decoration:none;font-size:.82rem}
.ph{position:relative}.ph button{position:absolute;top:3px;right:3px;background:#000c;color:#fff;border:0;border-radius:50%;width:24px;height:24px;cursor:pointer}
.sub{border-top:3px solid var(--blue);padding-top:10px;margin-top:14px}.sub.r{border-top-color:var(--red)}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.gal img[data-g]{cursor:zoom-in}
select{width:100%;background:#0f0f10;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:11px;font:inherit}
.lb{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.93);display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.lb img{max-width:96vw;max-height:86vh;object-fit:contain;border-radius:6px}
.lb button{position:absolute;background:#000b;color:#fff;border:1px solid var(--gold);border-radius:50%;width:44px;height:44px;font-size:1.5rem;line-height:1;cursor:pointer}
.lb .cl{top:calc(12px + env(safe-area-inset-top,0px));right:12px}.lb .pv{left:8px;top:50%;margin-top:-22px}.lb .nx{right:8px;top:50%;margin-top:-22px}

(async function(){
  try{
    if(FB_CONFIG.apiKey&&window.firebase){initFb();return}
    var SD="/api/public/site-data",ver="",fullList=[];
    function post(o){return fetch(SD,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(o)}).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||"erro");return j.data})})}
    function tk(){return ME&&ME.token||""}
    siteRef={set:function(m){return post({action:"setSite",token:tk(),meta:m}).then(poll)}};
    photoRef={doc:function(k){return {set:function(v){return post({action:"setPhoto",token:tk(),key:k,v:v})},delete:function(){return post({action:"delPhoto",token:tk(),key:k})}}}};
    dbRef={doc:function(id){return {set:function(b){return post({action:"book",booking:b}).then(poll)},delete:function(){return post({action:"cancel",token:tk(),id:id})}}}};
    async function poll(){
      try{

        if(r.photos){var m={};r.photos.forEach(function(v){if(v&&v.b&&okImg(v.u))(m[v.b]=m[v.b]||[])[v.i]=v.u});sitePh=m;ver=r.ver}

function applySite(){

  var o=JSON.parse(JSON.stringify(siteMeta));o.barbers=o.barbers||{};
  BARBERS.forEach(function(b){var d=o.barbers[b.id]=o.barbers[b.id]||{},a=(sitePh&&sitePh[b.id])||[],ph=[];for(var i=0;i<(d.n||0);i++)if(a[i])ph.push(a[i]);d.photos=ph});

async function saveBooking(b){
  if(fs){
    try{
      await fs.collection("busy").doc(b.id).set({id:b.id,barber:b.barber,date:b.date,time:b.time,dur:b.dur});
      await fs.collection("bookings").doc(b.id).set(b);
      dbNote="shared";return true;
    }catch(e){return false}
  }
  if(dbRef){
    try{await dbRef.doc(b.id).set(b);dbNote="shared";return true}catch(e){return false}
  }
  localBookings.push(b);saveLocal();dbNote="local";return true;
}
async function removeBooking(id){
  localBookings=localBookings.filter(function(b){return b.id!==id});saveLocal();
  if(fs){try{await fs.collection("bookings").doc(id).delete();await fs.collection("busy").doc(id).delete()}catch(e){}busyDocs=busyDocs.filter(function(b){return b.id!==id});fullDocs=fullDocs.filter(function(b){return b.id!==id})}
  if(dbRef){try{await dbRef.doc(id).delete()}catch(e){}}
  dbBookings=dbBookings.filter(function(b){return b.id!==id});
  renderAdmin();renderSlots();
}

/* ---------- datas e horários ---------- */
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function daysList(){var out=[],d=new Date();while(out.length<12){if(d.getDay()!==0)out.push(new Date(d));d.setDate(d.getDate()+1)}return out}
function times(){var o=[];for(var m=540;m<1140;m+=15){if(m>=720&&m<840)continue;o.push(String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0"))}return o}
function tm(t){var p=t.split(":");return +p[0]*60+ +p[1]}
function svc(){return SERVICES.filter(function(s){return s.id===sel.service})[0]}
function fits(st,d){var e=st+d;return st<720?e<=720:e<=1140}
function conflict(br,date,st,d){return all().some(function(b){if(b.barber!==br||b.date!==date)return false;var bs=tm(b.time);return bs<st+d&&st<bs+(b.dur||30)})}
function fmtDate(s){var p=s.split("-");var d=new Date(+p[0],+p[1]-1,+p[2]);return DAYN[d.getDay()]+", "+p[2]+"/"+p[1]}
function bid(b,d,t){return b+"-"+d+"-"+t.replace(":","")}

  w.appendChild(opt(esc(s.name)+"<small>"+s.min+" min</small>",sel.service===s.id,function(){sel.service=s.id;sel.time=null;renderServices();renderSlots()}))})}
function renderDays(){var w=$("days");w.innerHTML="";daysList().forEach(function(d){var k=iso(d);
  w.appendChild(opt(DAYN[d.getDay()]+"<small>"+String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"</small>",sel.date===k,function(){sel.date=k;sel.time=null;renderAll()},dayClosed(k)))})}
function renderSlots(){
  var w=$("slots");w.innerHTML="";
  if(!sel.barber||!sel.date||!sel.service){$("slotNote").textContent="Escolha barbeiro, serviço e dia para ver os horários.";return}
  $("slotNote").textContent="";
  var dur=svc().min;
  var now=new Date(),today=iso(now),nm=now.getHours()*60+now.getMinutes();
  times().forEach(function(t){
    var st=tm(t),past=sel.date===today&&st<=nm;
    w.appendChild(opt(t,sel.time===t,function(){sel.time=t;renderSlots()},past||!fits(st,dur)||conflict(sel.barber,sel.date,st,dur)))});
}
function closedOn(b,d){return (DATA.closed||[]).some(function(c){return c.d===d&&(c.b==="all"||c.b===b)})}
function dayClosed(k){return sel.barber?closedOn(sel.barber,k):(DATA.closed||[]).some(function(c){return c.d===k&&c.b==="all"})}

  var out=JSON.parse(JSON.stringify(ED));
  BARBERS.forEach(function(b){var d=out.barbers[b.id];d.wa=waNum(d.wa);d.ig=(d.ig||"").trim();d.bio=(d.bio||"").trim()});
  out.links=(out.links||[]).filter(function(l){return l&&l.l&&PUB.test((l.u||"").trim())}).map(function(l){return {l:l.l.trim(),u:l.u.trim()}});
  out.loc=(out.loc||"").trim();
  if(out.loc&&!PUB.test(out.loc))return edErr("O link da localização precisa começar com https://");
  out.closed=(out.closed||[]).filter(function(c){return c&&/^\d{4}-\d{2}-\d{2}$/.test(c.d)&&c.d>=iso(new Date())}).map(function(c){return {d:c.d,b:c.b,n:(c.n||"").slice(0,30)}});
  if(!siteRef||!photoRef){
    try{
      localStorage.setItem("novaera_site",JSON.stringify(out));DATA=out;renderShowcase();renderSlots();
      $("edSave").textContent="Salvo neste aparelho ✓";
      setTimeout(function(){var e=$("edSave");if(e)e.textContent="Salvar e publicar"},2500);
    }catch(x){edErr("Não foi possível salvar: as fotos ficaram pesadas demais para este aparelho. Remova algumas e tente de novo.")}
    return;
  }
  var meta={loc:out.loc,links:out.links,closed:out.closed,barbers:{}},jobs=[],old=(siteMeta&&siteMeta.barbers)||{};
  for(var bi=0;bi<BARBERS.length;bi++){
    var id=BARBERS[bi].id,d=out.barbers[id],ph=(d.photos||[]).filter(okImg),on=(old[id]&&old[id].n)||0;
    if(ME&&ME.b&&id!==ME.b){meta.barbers[id]=old[id]||{wa:d.wa,ig:d.ig,bio:d.bio,n:ph.length};continue}
    for(var k=0;k<ph.length;k++){
      if(ph[k].length>240000)return edErr("Uma das fotos ficou pesada demais. Remova e envie de novo.");
      if(!(sitePh&&sitePh[id]&&sitePh[id][k]===ph[k]))jobs.push({id:id,k:k,u:ph[k]});
    }
    for(var r=ph.length;r<on;r++)jobs.push({id:id,k:r,del:1});
    meta.barbers[id]={wa:d.wa,ig:d.ig,bio:d.bio,n:ph.length};
  }
  $("edSave").disabled=true;
  try{
    for(var j=0;j<jobs.length;j++){var q=jobs[j],ref=photoRef.doc(q.id+"_"+q.k);if(q.del)await ref.delete();else await ref.set({b:q.id,i:q.k,u:q.u})}
    await siteRef.set(meta);
    $("edSave").disabled=false;$("edSave").textContent="Publicado ✓";
    setTimeout(function(){var e=$("edSave");if(e)e.textContent="Salvar e publicar"},2500);
  }catch(x){
    $("edSave").disabled=false;
    edErr(x&&x.message==="forbidden"?"Seu acesso não permite salvar estas alterações ou a sessão expirou. Volte e entre novamente.":"Não foi possível salvar agora. Confira a internet e tente de novo.");
  }
}
var LB=null;
function closeLb(keep){var d=document.getElementById("lb");if(d)d.remove();if(!keep)LB=null}
function drawLb(){closeLb(true);var d=document.createElement("div"),n=LB.ph.length;d.className="lb";d.id="lb";d.innerHTML='<img alt="Foto do trabalho" src="'+LB.ph[LB.k]+'"><button class="cl" aria-label="Fechar">×</button>'+(n>1?'<button class="pv" aria-label="Anterior">‹</button><button class="nx" aria-label="Próxima">›</button>':'');d.onclick=function(e){var c=e.target.className;if(c==="pv")step(-1);else if(c==="nx")step(1);else closeLb()};document.body.appendChild(d)}
function step(x){LB.k=(LB.k+x+LB.ph.length)%LB.ph.length;drawLb()}
document.addEventListener("keydown",function(e){if(!LB)return;if(e.key==="Escape")closeLb();if(e.key==="ArrowRight")step(1);if(e.key==="ArrowLeft")step(-1)});
$("showcase").addEventListener("click",function(e){var t=e.target;if(t.dataset&&t.dataset.g){var ph=((DATA.barbers[t.dataset.g]||{}).photos||[]).filter(okImg);if(ph.length){LB={ph:ph,k:+t.dataset.k};drawLb()}}});
function renderClosed(){var l=$("clList");if(!l)return;var a=(ED.closed=ED.closed||[]).map(function(c,i){return {c:c,i:i}}).sort(function(x,y){return x.c.d.localeCompare(y.c.d)});l.innerHTML=a.map(function(o){var c=o.c,w=c.b==="all"?"Todos":(BARBERS.filter(function(b){return b.id===c.b})[0]||{}).name;return '<div class="row"><span class="c">'+esc(fmtDate(c.d))+' · '+esc(w||"")+(c.n?'<small>'+esc(c.n)+'</small>':"")+'</span><button class="x" type="button" data-rc="'+o.i+'">Remover</button></div>'}).join("")}
$("edWrap").addEventListener("click",function(e){
  var t=e.target;
  if(t.id==="clAdd"){var dt=$("clDate").value,wh=$("clWho").value;if(!dt)return edErr("Escolha o dia que vai ficar fechado.");$("edErr").classList.add("hide");ED.closed=ED.closed||[];if(!ED.closed.some(function(c){return c.d===dt&&c.b===wh}))ED.closed.push({d:dt,b:wh,n:$("clNote").value.trim()});$("clDate").value="";$("clNote").value="";renderClosed()}
  if(t.dataset&&t.dataset.rc){ED.closed.splice(+t.dataset.rc,1);renderClosed()}
});

window.addEventListener("hashchange",hashOpen);hashOpen();

var UNL=false;
var LASTDAY=iso(new Date());

setInterval(newDay,60000);document.addEventListener("visibilitychange",newDay);
$("tabAg").onclick=function(){if(!UNL)return;$("edWrap").classList.add("hide");$("list").classList.remove("hide");renderAdmin()};
$("tabEd").onclick=function(){if(!UNL)return;$("list").classList.add("hide");$("edWrap").classList.remove("hide");renderEditor()};
renderAll();renderServices();renderShowcase();
})();
